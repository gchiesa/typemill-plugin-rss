name: RSS
version: 2.2.0
description: Add RSS feeds to folders and the homepage
author: Giuseppe Chiesa, Andreas Zettl
homepage: https://g-c.dev
repo: https://github.com/typemill-resources/typemill-plugin-rss
license: MIT

forms:
  fields:

    mainrsstitle:
      type: text
      label: Title for Generic RSS Feed
      description: The title for the RSS Feed under yourpage.com/rss
      placeholder: 'My RSS Feed'

    mainrssdescription:
      type: text
      label: Description for Generic RSS Feed
      description: The description for the RSS Feed under yourpage.com/rss
      placeholder: 'My RSS Feed Description'

